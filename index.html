<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a2f" />
  <title>Dein Arbeitsblatt für diese Woche</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="board">
    <h1>✏️ Dein Arbeitsblatt für diese Woche</h1>
    <p class="subtitle">Wessen Aufgaben?</p>
  </header>

  <nav class="kid-tabs">
    <a class="kid-tab" href="tj/" style="--kid-color: var(--chalk-pink)">Tim</a>
    <a class="kid-tab" href="mj/" style="--kid-color: var(--chalk-blue)">Marlene</a>
  </nav>

  <footer class="board-footer">
    <p>Viel Erfolg &amp; viel Spaß dabei! 🧮📖</p>
    <p><a class="eltern-back-link" href="eltern/">👀 Für Eltern</a></p>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>

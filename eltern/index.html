<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ec" />
  <title>Eltern-Übersicht</title>
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <header class="board">
    <h1>👀 Eltern-Übersicht</h1>
    <p class="subtitle" id="summary">Lädt …</p>
    <div class="eltern-week-toggle" role="group" aria-label="Zeitraum wählen">
      <button type="button" class="eltern-week-btn is-active" data-mode="current">Aktuelle Woche</button>
      <button type="button" class="eltern-week-btn" data-mode="history">Frühere Wochen</button>
    </div>
  </header>

  <section id="code-gate" class="code-gate" hidden>
    <h2 class="results-title">🔑 Eltern-Code</h2>
    <p class="settings-note">Bitte den Eltern-Code eingeben oder den ganzen Link einfügen. Er bleibt auf diesem Gerät gespeichert.</p>
    <input id="gate-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Eltern-Code oder Link" aria-label="Eltern-Code oder Link" />
    <button id="gate-btn" class="chalk-button" type="button">Weiter</button>
    <p id="gate-error" class="gate-error" hidden></p>
  </section>

  <main id="kids" class="eltern-kids"></main>

  <footer class="board-footer">
    <p><a class="eltern-back-link" href="../">← Zurück zur Start­seite</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="../shared.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a2f" />
  <title>Dein Arbeitsblatt für diese Woche – Marlene</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-kid-id="kind2">

  <header class="board">
    <h1>✏️ Dein Arbeitsblatt für diese Woche</h1>
    <p class="subtitle">Hallo Marlene! Leg los mit deinen Aufgaben.</p>
  </header>

  <canvas id="puzzle-canvas" hidden></canvas>

  <main id="app">
    <section id="worksheet-picker" class="worksheet-picker" hidden>
      <div id="puzzle-picker" class="puzzle-picker" hidden>
        <div class="puzzle-frame" id="puzzle-frame">
          <div class="puzzle-image" id="puzzle-image"></div>
          <div class="puzzle-grid" id="puzzle-grid"></div>
        </div>
        <div class="puzzle-actions">
          <button id="puzzle-download" class="chalk-button ghost small" hidden>📥 Bild herunterladen</button>
          <button id="backlog-toggle" class="chalk-button ghost small" hidden>📚 Weitere Übungen</button>
        </div>
      </div>

      <div id="classic-picker">
        <p class="subtitle" id="picker-hint"></p>
        <div id="worksheet-list" class="worksheet-list"></div>
      </div>
    </section>

    <section id="worksheet-view" hidden>
      <button id="back-btn" class="chalk-button ghost small">← Andere Aufgabe wählen</button>

      <section id="status-panel" class="status-panel">
        <span id="week-label"></span>
        <span id="progress-label"></span>
      </section>

      <div id="task-list" class="task-list"></div>

      <div class="actions">
        <button id="check-btn" class="chalk-button" hidden>Fertig – prüfen!</button>
        <button id="retry-btn" class="chalk-button ghost" hidden>Nochmal versuchen</button>
      </div>

      <div id="result-banner" class="result-banner" hidden></div>
    </section>
  </main>

  <footer class="board-footer">
    <p>Viel Erfolg &amp; viel Spaß dabei! 🧮📖</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="../shared.js" defer></script>
  <script src="../app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js').catch(console.error);
      });
      // Läd die Seite einmal neu, sobald ein neuer Service Worker (= neuer
      // Deploy) die Kontrolle übernimmt – verhindert, dass alter, gecachter
      // app.js-Code gegen neues HTML läuft und mit einer leeren Seite abstürzt.
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>

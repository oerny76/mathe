<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ec" />
  <title>Mathe-Stunde für Marlene</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-kid-id="kind2">

  <header class="board">
    <h1>✏️ Mathe-Stunde</h1>
    <p class="subtitle">Hallo Marlene! Was möchtest du heute üben?</p>
  </header>

  <canvas id="puzzle-canvas" hidden></canvas>

  <main id="app">
    <section id="worksheet-picker" class="worksheet-picker" hidden>
      <div class="status-bar">
        <div class="status-pill">
          <span class="status-pill-value" id="star-counter"></span>
          <span class="status-pill-label">Sterne</span>
        </div>
        <button type="button" class="status-pill status-pill-button" id="streak-pill" aria-expanded="false">
          <span class="status-pill-value" id="streak-main"></span>
          <span class="status-pill-label">Wochen-Streak ▾</span>
        </button>
        <div class="status-pill">
          <span class="status-pill-value" id="week-days"></span>
          <span class="status-pill-label">Tage diese Woche</span>
        </div>
      </div>
      <p id="star-next" class="star-next"></p>
      <p id="weekly-usage-hint" class="weekly-usage-hint" hidden></p>
      <div id="streak-details" class="streak-details" hidden>
        <div id="streak-weeks" class="streak-weeks"></div>
        <p id="streak-sub" class="streak-sub"></p>
      </div>

      <div class="sprint-toggle-row">
        <button id="sprint-start-btn" class="chalk-button sprint-start">🧠 Tägliches Kopfrechnen (10 Min)</button>
        <p id="sprint-today-hint" class="sprint-today-hint" hidden></p>
      </div>
      <div class="luecken-toggle-row">
        <button id="world-open-btn" class="chalk-button ghost small">🧺 Meine Sammelwelt</button>
        <button id="results-open-btn" class="chalk-button ghost small">📋 Meine Ergebnisse</button>
        <button id="luecken-toggle" class="chalk-button ghost small" hidden>📊 Wo stehe ich?</button>
      </div>
      <div id="luecken-panel" class="luecken-panel" hidden>
        <p class="luecken-panel-title">📊 Wo stehst du gerade?</p>
        <div id="luecken-list" class="luecken-list"></div>
      </div>

      <div id="puzzle-picker" class="puzzle-picker" hidden>
        <div class="puzzle-frame" id="puzzle-frame">
          <div class="puzzle-image" id="puzzle-image"></div>
          <div class="puzzle-grid" id="puzzle-grid"></div>
        </div>
        <div class="puzzle-actions">
          <button id="puzzle-download" class="chalk-button ghost small" hidden>📥 Bild herunterladen</button>
          <button id="backlog-toggle" class="chalk-button ghost small" hidden>📚 Weitere Übungen</button>
        </div>
      </div>

      <div id="classic-picker">
        <p class="subtitle" id="picker-hint"></p>
        <div id="worksheet-list" class="worksheet-list"></div>
      </div>

      <div class="settings-toggle-row">
        <button id="settings-toggle" class="chalk-button ghost small">⚙️ Einstellungen (Eltern)</button>
      </div>
      <div id="settings-panel" class="settings-panel" hidden>
        <div id="settings-lock">
          <p class="settings-note">Nur für Eltern. Bitte den Code eingeben.</p>
          <div class="settings-lock-row">
            <input id="settings-code" type="text" inputmode="numeric" maxlength="4" placeholder="Code" autocomplete="off" />
            <button id="settings-code-ok" class="chalk-button ghost small">OK</button>
            <span id="settings-code-error" class="settings-error" hidden>Falscher Code</span>
          </div>
        </div>
        <div id="settings-content" hidden>
          <p id="settings-grade-info" class="settings-note"></p>
          <label class="settings-option">
            <input id="settings-lower-grade" type="checkbox" />
            Eine Klassenstufe tiefer üben
          </label>
        </div>
      </div>
    </section>

    <section id="worksheet-view" hidden>
      <button id="back-btn" class="chalk-button ghost small">← Andere Aufgabe wählen</button>

      <section id="status-panel" class="status-panel">
        <span id="week-label"></span>
        <span id="progress-label"></span>
      </section>

      <div id="task-list" class="task-list"></div>

      <div class="actions">
        <button id="check-btn" class="chalk-button" hidden>Fertig – prüfen!</button>
        <button id="retry-btn" class="chalk-button ghost" hidden>Nochmal versuchen</button>
      </div>

      <div id="result-banner" class="result-banner" hidden></div>
    </section>

    <section id="world-view" hidden>
      <button id="world-back-btn" class="chalk-button ghost small">← Zurück</button>
      <h2 class="results-title" id="world-title"></h2>
      <p class="world-total" id="world-total"></p>
      <div id="world-grid" class="world-grid"></div>
    </section>

    <section id="results-view" hidden>
      <button id="results-back-btn" class="chalk-button ghost small">← Zurück</button>
      <h2 class="results-title">📋 Meine Ergebnisse</h2>
      <div id="results-list" class="results-list"></div>
    </section>

    <section id="redo-view" hidden>
      <p class="redo-progress" id="redo-progress"></p>
      <div id="redo-task-card" class="task-card">
        <p class="task-question" id="redo-question"></p>
        <div class="task-input-row">
          <input type="text" inputmode="decimal" autocomplete="off" id="redo-input" placeholder="Deine Antwort" />
          <span class="task-mark" aria-hidden="true"></span>
        </div>
        <p class="redo-solution" id="redo-solution" hidden></p>
      </div>
      <div id="redo-summary" class="result-banner" hidden></div>
      <div class="actions">
        <button id="redo-check-btn" class="chalk-button">Prüfen</button>
        <button id="redo-stop-btn" class="chalk-button ghost small">Zurück zu den Ergebnissen</button>
      </div>
    </section>

    <section id="sprint-view" hidden>
      <p class="sprint-timer" id="sprint-timer">10:00</p>
      <div id="sprint-task-card" class="task-card">
        <p class="task-question" id="sprint-question"></p>
        <div class="task-input-row">
          <input type="text" inputmode="decimal" autocomplete="off" id="sprint-input" placeholder="Deine Antwort" />
          <span class="task-mark" aria-hidden="true"></span>
        </div>
      </div>
      <div class="actions">
        <button id="sprint-stop-btn" class="chalk-button ghost small">Abbrechen</button>
      </div>
    </section>

    <section id="sprint-summary" hidden>
      <div id="sprint-summary-banner" class="result-banner"></div>
      <div id="sprint-trend-row" class="sprint-trend-row"></div>
      <p id="sprint-trend-compare" class="sprint-trend-compare" hidden></p>
      <p id="sprint-weak-note" class="sprint-weak-note" hidden></p>
      <div class="actions">
        <button id="sprint-details-toggle" class="chalk-button ghost small" hidden>📋 Details ansehen</button>
        <button id="sprint-summary-close" class="chalk-button">Zurück zur Übersicht</button>
      </div>
      <div id="sprint-details-panel" class="sprint-details-panel" hidden>
        <div id="sprint-details-list" class="sprint-details-list"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="board-footer">
    <p>Viel Erfolg &amp; viel Spaß dabei! 🧮📖</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="../shared.js" defer></script>
  <script src="../app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js').catch(console.error);
      });
      // Läd die Seite einmal neu, sobald ein neuer Service Worker (= neuer
      // Deploy) die Kontrolle übernimmt – verhindert, dass alter, gecachter
      // app.js-Code gegen neues HTML läuft und mit einer leeren Seite abstürzt.
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>

# Hält das kostenlose Supabase-Projekt wach: Der Gratis-Tarif pausiert nach
# etwa einer Woche ohne Zugriffe. Diese Aktion schickt einmal täglich einen
# winzigen Aufruf der offenen Funktion app_ping (siehe supabase/zugangscodes.sql,
# ohne diese Funktion schlägt der Lauf fehl). Der verwendete Schlüssel ist der
# öffentliche (publishable) Schlüssel, der ohnehin im Seitencode steht.
name: Supabase wachhalten

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Lebenszeichen an Supabase
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "https://gkqpgnwmmwvdtpdcqwye.supabase.co/rest/v1/rpc/app_ping" \
            -H "apikey: sb_publishable_1EraAljaYautx0yw-eLrsw_X25gwY2M" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o /dev/null
          echo "Supabase hat geantwortet."

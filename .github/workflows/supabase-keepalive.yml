# Hält das kostenlose Supabase-Projekt wach: Der Gratis-Tarif pausiert nach
# etwa einer Woche ohne Zugriffe. Diese Aktion schickt einmal täglich eine
# winzige Leseanfrage. Der verwendete Schlüssel ist der öffentliche
# (publishable) Schlüssel, der ohnehin im Seitencode steht.
name: Supabase wachhalten

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Leseanfrage an Supabase
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            "https://gkqpgnwmmwvdtpdcqwye.supabase.co/rest/v1/attempts?select=id&limit=1" \
            -H "apikey: sb_publishable_1EraAljaYautx0yw-eLrsw_X25gwY2M" \
            -H "Authorization: Bearer sb_publishable_1EraAljaYautx0yw-eLrsw_X25gwY2M" \
            -o /dev/null
          echo "Supabase hat geantwortet."
